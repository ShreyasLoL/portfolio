<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Shreyas | Portfolio</title>
  <meta name="description" content="Reverse Engineer | CSE">

  <!-- Open Graph -->
  <meta property="og:title" content="Shreyas | Portfolio">
  <meta property="og:description" content="Reverse Engineer | CSE">
  <!-- TODO(domain): Set absolute URL once production domain is finalized (e.g. https://<domain>/assets/og.png) -->
  <meta property="og:image" content="assets/og.png">
  <meta property="og:type" content="website">

  <!-- Favicon & Touch Icons -->
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">

  <!-- Fonts: self-hosted (styles.css), above-the-fold faces preloaded -->
  <link rel="preload" href="assets/fonts/newsreader-roman.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/newsreader-italic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/jetbrains-mono.woff2" as="font" type="font/woff2" crossorigin>

  <!-- Browser chrome: --color-bg per theme. These values mirror the CSS tokens. -->
  <meta name="theme-color" content="#F7F4ED">
  <meta name="theme-color" content="#F7F4ED" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F0E0E" media="(prefers-color-scheme: dark)">

  <!-- Theme Initialization to prevent FOUC -->
  <script>
    (function() {
      function getTheme() {
        try { return localStorage.getItem('theme'); } catch(e) { return null; }
      }
      var theme = getTheme();
      if (theme === 'dark' || theme === 'light') {
        document.documentElement.setAttribute('data-theme', theme);
      } else {
        document.documentElement.setAttribute('data-theme', window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      }

      // Browser chrome follows the resolved theme (saved override included),
      // reusing the hex from the matching meta above.
      var resolved = document.documentElement.getAttribute('data-theme');
      var metas = document.querySelectorAll('meta[name="theme-color"]');
      var color = document.querySelector('meta[name="theme-color"][media*="' + resolved + '"]').getAttribute('content');
      for (var i = 0; i < metas.length; i++) metas[i].setAttribute('content', color);
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <span class="topbar-name-target" aria-hidden="true"></span>
      <nav aria-label="Primary navigation">
        <ul class="nav-list">
          <li><a href="#work" class="nav-link" data-section="work" aria-current="location"><span class="nav-copy">Work</span></a></li>
          <li><a href="#proof" class="nav-link" data-section="proof"><span class="nav-copy">Proof</span></a></li>
          <!-- Uncomment this link when enabling the Writeups section.

          -->

    </div>

    <button class="theme-toggle" aria-label="Toggle theme" title="Toggle theme">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <mask id="moon-mask">
          <rect x="0" y="0" width="100%" height="100%" fill="white"/>
          <circle class="moon-mask" cx="15" cy="9" r="6" fill="black"/>
        </mask>
        <circle class="sun-core" cx="12" cy="12" r="5" mask="url(#moon-mask)" fill="currentColor" stroke="none"/>
        <g class="sun-rays">
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </g>
      </svg>
    </button>
  </header>

  <main class="site-main">
    <section class="hero" aria-labelledby="hero-name">
      <div class="hero-content">
        <div class="hero-name-slot">
          <h1 class="hero-name" id="hero-name">Shreyas</h1>
        </div>
        <p class="hero-title">REVERSE ENGINEER | CSE</p>
        <blockquote class="hero-quote">
          <span>I read systems the way</span>
          <span>I read people:</span>
          <span>for what they're not saying.</span>
        </blockquote>
        <div class="hero-education">
          <p>B.Tech CSE-IoT · Cybersecurity · REVA University · 2029</p>
          <div class="avatar" role="img" aria-label="Photo of Shreyas">
            <img
              src="assets/avatar.jpg"
              alt="Shreyas I Sutrave"
              width="48"
              height="48"
              decoding="async"
              onerror="this.parentElement.classList.add('avatar--placeholder'); this.style.display='none';"
            >
          </div>
        </div>
      </div>
    </section>

    <div class="content-column">
      <section id="work" class="section">

        <div class="divider"></div>
      </section>

      <section id="proof" class="section">

      <!-- Uncomment this section when enabling the Writeups navigation link.
      <section id="writeups" class="section">

      <section id="contact" class="section">

  </main>

  <script src="script.js"></script>

</html>
